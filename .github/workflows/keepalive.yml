name: Supabase wachhalten

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://owfyrxjtbwkrqplvvuiy.supabase.co/rest/v1/bookings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP-Status: $code"
          if [ "$code" != "200" ]; then
            echo "Ping fehlgeschlagen"
            exit 1
          fi
          echo "Supabase ist erreichbar."
