name: Supabase wachhalten

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        run: |
          echo "Laenge des Secrets: ${#KEY} Zeichen"
          echo "--- Antwort der Datenbank ---"
          curl -s -w "\nHTTP-Status: %{http_code}\n" \
            "https://owfyrxjtbwkrqplvvuiy.supabase.co/rest/v1/" \
            -H "apikey: $KEY"
          echo "--- Antwort Auth-Endpunkt ---"
          curl -s -w "\nHTTP-Status: %{http_code}\n" \
            "https://owfyrxjtbwkrqplvvuiy.supabase.co/auth/v1/health" \
            -H "apikey: $KEY"
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
